<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real-Time Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login" class="login">
        <form id="login-form" class="card">
            <h1>Real-Time Chat</h1>
            <p class="muted">Pick a username to join. Usernames are unique while you are connected.</p>
            <input id="username" type="text" placeholder="e.g. shubham_01" pattern="[A-Za-z0-9_\-]{3,20}" minlength="3" maxlength="20" autocomplete="off" required>
            <button type="submit">Join chat</button>
            <p id="login-error" class="error"></p>
        </form>
    </div>

    <div id="app" class="app hidden">
        <aside class="sidebar">
            <h2>Rooms</h2>
            <ul id="room-list" class="room-list"></ul>

            <details>
                <summary>Create a room</summary>
                <form id="create-form" class="stack">
                    <input id="create-name" type="text" placeholder="Room name" maxlength="40" required>
                    <select id="create-type">
                        <option value="PUBLIC">Public</option>
                        <option value="PRIVATE">Private</option>
                    </select>
                    <input id="create-password" class="hidden" type="password" placeholder="Room password" maxlength="72">
                    <button type="submit">Create</button>
                </form>
            </details>

            <details>
                <summary>Join a private room</summary>
                <form id="join-form" class="stack">
                    <input id="join-code" type="text" placeholder="Invite code" required>
                    <input id="join-password" type="password" placeholder="Password" required>
                    <button type="submit">Join</button>
                </form>
            </details>

            <div id="me" class="me"></div>
        </aside>

        <main class="chat">
            <header class="chat-header">
                <h2 id="room-title">Connecting...</h2>
                <span id="room-code" class="muted"></span>
            </header>
            <div class="chat-body">
                <div id="messages" class="messages"></div>
                <ul id="users" class="users"></ul>
            </div>
            <form id="send-form" class="send">
                <input id="message-input" type="text" placeholder="Type a message" maxlength="1000" autocomplete="off" disabled>
                <button type="submit">Send</button>
            </form>
        </main>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
